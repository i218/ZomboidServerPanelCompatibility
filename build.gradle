plugins { id 'java' }

group = 'io.serverpanelbridge'
version = '0.4.1'
java { sourceCompatibility = JavaVersion.VERSION_11; targetCompatibility = JavaVersion.VERSION_11 }
tasks.withType(JavaCompile).configureEach {
    options.release = 11
    options.encoding = 'UTF-8'
}
tasks.named('jar') {
    archiveFileName = 'ServerPanelBridge.jar'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest { attributes 'Implementation-Title': 'ServerPanelBridge', 'Implementation-Version': project.version }
}
tasks.register('selfTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.serverpanelbridge.BridgeTests'
}
tasks.named('check') { dependsOn selfTest }
tasks.register('stageMod', Copy) {
    dependsOn jar
    from(tasks.named('jar'))
    into layout.projectDirectory.dir('42/media/java')
}
tasks.register('modZip', Zip) {
    dependsOn stageMod
    archiveFileName = 'ServerPanelBridge-mod.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    into('ServerPanelBridge') {
        into('42') { from('42') }
        into('common') { from('common') }
        into('config') { from('config') }
        into('docs') { from('docs') }
        into('client-support') { from('client-support') }
        from('README.md', 'README.ru.md', 'VERIFICATION.md')
    }
}
tasks.named('build') { dependsOn stageMod }

tasks.register('installer', Exec) {
    dependsOn modZip, check
    commandLine 'powershell.exe', '-NoProfile', '-File', file('installer/build.ps1')
}

tasks.register('controlTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.serverpanelbridge.ControlTests'
}
tasks.named('check') { dependsOn controlTest }

// Embed the Windows handle-isolation launcher; installation needs no compiler.
def launcherResources = layout.buildDirectory.dir('generated/launcher-resources')
sourceSets.main.resources.srcDir launcherResources
tasks.register('windowsRestartLauncher', Exec) {
    onlyIf { System.getProperty('os.name').startsWith('Windows') }
    inputs.files('windows/RestartLauncher.cs', 'windows/build.ps1')
    outputs.file(launcherResources.map { it.file('windows/RestartLauncher.exe') })
    commandLine 'powershell.exe', '-NoProfile', '-File', file('windows/build.ps1'), '-Destination', launcherResources.get().file('windows/RestartLauncher.exe').asFile
}
tasks.named('processResources') { dependsOn 'windowsRestartLauncher' }

tasks.register('panelCompatibilityTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.serverpanelbridge.PanelCompatibilityTests'
    jvmArgs '-Dfile.encoding=UTF-8'
}
tasks.named('check') { dependsOn panelCompatibilityTest }

// One canonical schema for installer defaults and runtime migrations.
tasks.named('processResources') {
    from('config/ServerPanelBridge.properties') { into 'defaults' }
}

tasks.register('configMigrationTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.serverpanelbridge.ConfigMigrationTests'
    jvmArgs '-Dfile.encoding=UTF-8'
}
tasks.named('check') { dependsOn configMigrationTest }
