# Copy beside server-specific runtime config, or let the mod create safe defaults.
# Default: <PZ cachedir>/ServerPanelBridge/<serverName>/ServerPanelBridge.properties
enabled=true
panelUrl=http://127.0.0.1:5088
# Empty ID/name use pz-<serverName> and Project Zomboid: <serverName>.
hostId=
hostName=
category=Game servers
environment=Production
# Informational display text only; not a network destination.
address=Local dedicated server
heartbeatSeconds=5
requestTimeoutSeconds=2
staleTickSeconds=20
maxRetrySeconds=30
commandsEnabled=true
stopEnabled=false
stopWhenPlayersOnline=false

# Uses the bundled helper; do not combine with another auto-restart supervisor.
restartEnabled=false
restartExitTimeoutSeconds=180

# Latest panel Output tab: bridge events by default; full game console is opt-in.
outputEnabled=true
# May transmit player IPs, chat and secrets printed by other mods. No redaction guarantee.
captureConsoleOutput=false
# Optional JVM-local integrations; empty disables all requests from other mods.
# Also requires restartEnabled=true. Requester names are not security identities.
restartRequesters=
